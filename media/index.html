<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>メディア掲載</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#cf7184;--pink-pale:#f7e3e8;--navy:#4a5670;--gray:#cfd4e1;--ink:#333;--bg:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",sans-serif;overflow-x:hidden}
img{display:block;max-width:100%}

/* ===== A: 掲載誌面 ===== */
.feature{position:relative;display:grid;grid-template-columns:1fr 1.1fr;align-items:center;gap:24px;
  max-width:1080px;margin:0 auto;padding:56px 32px 40px}
.feature::before{content:"";position:absolute;inset:40px 0 30px 45%;border-radius:28px;
  background:linear-gradient(135deg,var(--pink-pale),#e9ecf4);z-index:0}
.copy{position:relative;z-index:1}
.label{display:inline-block;font-size:12px;letter-spacing:.25em;color:#fff;background:var(--pink);
  padding:6px 14px;border-radius:999px}
.copy h2{font-family:"Noto Serif JP",serif;font-size:clamp(22px,2.6vw,32px);line-height:1.5;margin:18px 0 14px;color:var(--navy)}
.copy h2 em{font-style:normal;color:var(--pink)}
.topics{list-style:none;margin:0 0 22px}
.topics li{font-size:14px;line-height:1.8;padding-left:1.2em;position:relative}
.topics li::before{content:"";position:absolute;left:0;top:.75em;width:7px;height:7px;border-radius:50%;background:var(--pink)}
.quote{font-family:"Noto Serif JP",serif;font-size:clamp(16px,1.7vw,20px);line-height:1.8;color:var(--navy);
  border-left:3px solid var(--pink);padding:4px 0 4px 16px}
.quote small{display:block;font-family:"Noto Sans JP",sans-serif;font-size:12px;color:#888;margin-top:4px}

.stage{position:relative;z-index:1;height:440px}
.sheet{position:absolute;border-radius:6px;background:#fff;box-shadow:0 18px 40px rgba(60,70,100,.22);
  opacity:0;transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .9s ease,box-shadow .3s;will-change:transform}
.sheet img{border-radius:6px}
.s-p1{width:44%;left:6%;top:30px;transform:translate(60px,40px) rotate(0deg)}
.s-p2{width:50%;right:0;top:250px;transform:translate(-60px,-30px) rotate(0deg)}
.s-cover{width:42%;left:33%;top:0;transform:translateY(60px) scale(.9)}
.in .s-p1{opacity:1;transform:rotate(-9deg);transition-delay:.35s}
.in .s-p2{opacity:1;transform:rotate(6deg);transition-delay:.6s}
.in .s-cover{opacity:1;transform:none;transition-delay:.1s}
.in .sheet{animation:float 6s ease-in-out infinite}
.in .s-p1{animation-delay:1.4s}.in .s-p2{animation-delay:2.2s}.in .s-cover{animation-delay:1s}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -8px}}
.sheet:hover{z-index:5;box-shadow:0 26px 50px rgba(60,70,100,.32);scale:1.04}
.badge{position:absolute;z-index:6;left:0;top:-18px;width:92px;height:92px;border-radius:50%;
  background:var(--pink);color:#fff;display:grid;place-items:center;text-align:center;font-size:12px;line-height:1.35;
  font-weight:700;box-shadow:0 8px 20px rgba(207,113,132,.4);opacity:0;transform:scale(.4) rotate(-20deg);
  transition:all .7s cubic-bezier(.3,1.6,.5,1) .9s}
.in .badge{opacity:1;transform:scale(1) rotate(-8deg)}
.badge b{font-size:18px;display:block}

.copy>*{opacity:0;transform:translateY(18px);transition:all .8s ease}
.in .copy>*{opacity:1;transform:none}
.in .copy>*:nth-child(2){transition-delay:.15s}.in .copy>*:nth-child(3){transition-delay:.3s}.in .copy>*:nth-child(4){transition-delay:.45s}

/* ===== A2: lumily 出演動画 ===== */
.video{grid-template-columns:1.15fr 1fr;padding-top:24px}
.video::before{inset:30px 45% 20px 0;background:linear-gradient(135deg,#e9ecf4,var(--pink-pale))}
.video .copy{order:2}
.screen{position:relative;z-index:1;margin:30px 10px 30px 20px;opacity:0;transform:translateX(-50px) rotate(-4deg);
  transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .9s ease}
.in .screen{opacity:1;transform:rotate(-2deg)}
.player{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;cursor:pointer;
  box-shadow:0 22px 50px rgba(60,70,100,.28);border:6px solid #fff;transition:transform .35s,box-shadow .35s}
.player:hover{transform:translateY(-4px) rotate(2deg);box-shadow:0 30px 60px rgba(60,70,100,.34)}
.player img{width:100%;height:100%;object-fit:cover;transition:transform 6s ease}
.player:hover img{transform:scale(1.06)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;
  background:var(--pink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(207,113,132,.5)}
.play::before{content:"";margin-left:6px;border-style:solid;border-width:14px 0 14px 22px;border-color:transparent transparent transparent #fff}
.play::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--pink);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
.onair{position:absolute;z-index:3;top:-14px;left:-10px;background:#fff;color:var(--pink);font-weight:700;font-size:12px;
  letter-spacing:.15em;padding:7px 14px 7px 26px;border-radius:999px;box-shadow:0 6px 16px rgba(60,70,100,.18)}
.onair::before{content:"";position:absolute;left:11px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#e8344a;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.chip{position:absolute;z-index:3;background:#fff;color:var(--navy);font-size:13px;font-weight:700;padding:8px 16px;border-radius:999px;
  box-shadow:0 8px 20px rgba(60,70,100,.18);opacity:0;transform:scale(.3);transition:all .6s cubic-bezier(.3,1.6,.5,1)}
.chip b{color:var(--pink)}
.c1{right:-6px;top:6%}.c2{right:-22px;top:38%}.c3{left:8%;bottom:-18px}
.in .chip{opacity:1;transform:none;animation:bob 4s ease-in-out infinite}
.in .c1{transition-delay:.8s;animation-delay:1.6s}.in .c2{transition-delay:1s;animation-delay:2.3s}.in .c3{transition-delay:1.2s;animation-delay:3s}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -7px}}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:22px;background:var(--pink);color:#fff;text-decoration:none;
  font-size:14px;font-weight:700;padding:12px 24px;border-radius:999px;border:0;cursor:pointer;box-shadow:0 8px 20px rgba(207,113,132,.35);transition:transform .25s}
.btn:hover{transform:translateY(-3px)}

/* ===== B: 掲載実績の帯 ===== */
.marquee-wrap{position:relative;padding:26px 0 46px}
.marquee-title{text-align:center;font-size:12px;letter-spacing:.3em;color:var(--pink);margin-bottom:18px}
.marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:28px;width:max-content;animation:scroll 40s linear infinite}
.marquee:hover .track{animation-play-state:paused}
@keyframes scroll{to{transform:translateX(-50%)}}
.item{flex:none;text-align:center;width:max-content}
.item .ph{height:170px;display:flex;align-items:flex-end;justify-content:center}
.item img{height:170px;width:auto;border-radius:4px;box-shadow:0 8px 20px rgba(60,70,100,.15);transition:transform .3s}
.item:hover img{transform:translateY(-6px)}
.item p{font-size:11px;color:#666;margin-top:10px;max-width:220px;margin-inline:auto;line-height:1.5}

@media (max-width:760px){
  .feature{grid-template-columns:1fr;padding:36px 18px 20px;gap:10px}
  .feature::before{inset:auto 0 0 0;height:400px}
  .stage{height:380px;max-width:420px;width:100%;margin:0 auto}
  .s-p2{top:230px}
  .video .copy{order:-1}
  .video::before{inset:auto 0 0 0;height:300px}
  .screen{margin:20px 14px 36px}
  .c2{right:-6px;top:auto;bottom:22%}
  .play{width:60px;height:60px;margin:-30px 0 0 -30px}
  .item .ph,.item img{height:130px}
  .track{animation-duration:30s}
}
@media (prefers-reduced-motion:reduce){
  .sheet,.badge,.copy>*,.screen,.chip{transition:none!important;animation:none!important;opacity:1!important}
  .track{animation:none}
}
</style>
</head>
<body>
<section class="feature" id="feature">
  <div class="copy">
    <span class="label">MEDIA</span>
    <h2><em>日経WOMAN</em> 2026年9月号に<br>掲載されました</h2>
    <ul class="topics">
      <li>特集「やめる＆捨てる決断の極意」</li>
      <li>特集「“月曜から元気な人”の休み方」</li>
    </ul>
    <p class="quote">休むことを自分に許したら、<br>経営者としても成長できた<small>― 誌面より</small></p>
  </div>
  <div class="stage">
    <div class="badge"><span><b>掲載</b>日経WOMAN<br>2026.9</span></div>
    <div class="sheet s-p1"><img src="img/nw2026_p1.jpg" alt="日経WOMAN 2026年9月号 掲載ページ" loading="lazy"></div>
    <div class="sheet s-p2"><img src="img/nw2026_p2.jpg" alt="日経WOMAN 2026年9月号 掲載ページ" loading="lazy"></div>
    <div class="sheet s-cover"><img src="img/nw2026_cover.jpg" alt="日経WOMAN 2026年9月号 表紙"></div>
  </div>
</section>

<section class="feature video" id="video">
  <div class="screen">
    <span class="onair">YouTube 出演</span>
    <div class="player" id="player" role="button" tabindex="0" aria-label="lumilyの出演動画を再生">
      <img src="img/lumily_thumb.jpg" alt="lumily 出演動画のサムネイル" loading="lazy">
      <span class="play"></span>
    </div>
    <span class="chip c1"><b>融資</b> のこと</span>
    <span class="chip c2"><b>補助金</b> のこと</span>
    <span class="chip c3"><b>助成金</b> のこと</span>
  </div>
  <div class="copy">
    <span class="label">VIDEO</span>
    <h2>ライフスタイルメディア<br><em>「lumily」</em>に出演しました</h2>
    <ul class="topics">
      <li>起業するときに知っておきたいお金のこと</li>
      <li>融資・補助金・助成金をわかりやすく解説</li>
    </ul>
    <button class="btn" id="playBtn" type="button">動画を見る ▶</button>
  </div>
</section>

<section class="marquee-wrap">
  <p class="marquee-title">BOOKS &amp; MEDIA</p>
  <div class="marquee"><div class="track" id="track"></div></div>
</section>

<script>
const items=[
  ["m_nw2026.jpg","日経WOMAN 2026年9月号"],
  ["m_book.jpg","著書『起業初心者の会計まるわかり本』"],
  ["m_nw2024.jpg","日経WOMAN 2024年9月号"],
  ["m_fpj.jpg","FPジャーナル 2024年8月号"],
  ["m_cpa.jpg","CPA会計学院 ロールモデルインタビュー"],
  ["m_flat.jpg","「ふらっと＋」インタビュー"],
  ["m_bizup.jpg","ビズアップ総研「税理士.Ch」"],
  ["m_lumily.jpg","lumily 出演動画"]
];
const html=items.map(([f,t])=>`<div class="item"><div class="ph"><img src="img/${f}" alt="${t}"></div><p>${t}</p></div>`).join("");
document.getElementById("track").innerHTML=html+html;
const secs=[...document.querySelectorAll(".feature")];
const show=()=>secs.forEach(f=>{const r=f.getBoundingClientRect();if(r.top<innerHeight*0.85&&r.bottom>0)f.classList.add("in")});
if("IntersectionObserver"in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add("in")}),{threshold:.2});secs.forEach(s=>io.observe(s));}
addEventListener("scroll",show,{passive:true});setTimeout(show,300);
/* 動画はクリックしたときだけYouTubeを読み込む */
const player=document.getElementById("player");
const play=()=>{if(player.querySelector("iframe"))return;player.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/niUzVILsA-I?autoplay=1&rel=0" title="lumily 出演動画" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';};
player.addEventListener("click",play);player.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();play()}});
document.getElementById("playBtn").addEventListener("click",()=>{player.scrollIntoView({behavior:"smooth",block:"center"});play();});
</script>
</body>
</html>
